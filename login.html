
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - DUNIAMU</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #ffffff; color: #1e293b; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .logo { font-size: 2rem; color: #2563eb; font-weight: 800; margin-bottom: 40px; }
    .input-group { width: 100%; max-width: 350px; margin-bottom: 15px; }
    .input-group input { width: 100%; padding: 16px; border-radius: 12px; border: 1px solid #e2e8f0; background: #f8fafc; font-size: 1rem; outline: none; }
    .input-group input:focus { border-color: #2563eb; }
    .btn-login { width: 100%; max-width: 350px; padding: 16px; border-radius: 12px; border: none; background: #2563eb; color: white; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 10px; }
    .btn-google { width: 100%; max-width: 350px; padding: 14px; border-radius: 12px; border: 1px solid #e2e8f0; background: white; display: flex; justify-content: center; align-items: center; gap: 10px; font-weight: 600; color: #475569; cursor: pointer; margin-top: 15px; }
    .btn-google img { width: 20px; height: 20px; }
    #error-msg { color: #ef4444; font-size: 0.9rem; margin-top: 15px; display: none; text-align: center; }
  </style>
</head>
<body>
  <div class="logo">DUNIAMU</div>
  <div class="input-group"><input type="email" id="email" placeholder="Email"></div>
  <div class="input-group"><input type="password" id="password" placeholder="Kata Sandi"></div>
  <button class="btn-login" id="btn-email">Masuk</button>
  <div style="margin: 20px 0; color: #94a3b8;">Atau</div>
  <button class="btn-google" id="btn-google">
    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"> Login dengan Google
  </button>
  <div id="error-msg"></div>

  <script type="module">
    import { auth } from './firebase-config.js';
    import { GoogleAuthProvider, signInWithPopup, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const errorMsg = document.getElementById('error-msg');

    document.getElementById('btn-email').addEventListener('click', async () => {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      try {
        await signInWithEmailAndPassword(auth, email, password);
        window.location.href = "profile.html";
      } catch (e) {
        errorMsg.style.display = 'block';
        errorMsg.innerText = "Email atau sandi salah.";
      }
    });

    document.getElementById('btn-google').addEventListener('click', async () => {
      try {
        const provider = new GoogleAuthProvider();
        await signInWithPopup(auth, provider);
        window.location.href = "profile.html";
      } catch (e) {
        errorMsg.style.display = 'block';
        errorMsg.innerText = "Gagal login: " + e.message;
      }
    });
  </script>
</body>
</html>
