    <div class="dropdown" id="dropdown">
      <a href="index.html" >🏠 Beranda</a>
      <a href="library.html" >📚 Library</a>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const btn = document.getElementById('menu-btn');
    const dd = document.getElementById('dropdown');
    if(btn && dd) {
      btn.onclick = (e) => { e.stopPropagation(); dd.style.display = dd.style.display === 'flex' ? 'none' : 'flex'; };
      document.addEventListener('click', (e) => { if(!dd.contains(e.target) && !btn.contains(e.target)) dd.style.display = 'none'; });
    }
  });
</script>

<main class="section">
  <h1>Withdraw Koin</h1>
  <p class="muted" style="margin-bottom:20px">100 koin = Rp100 · Minimal 10.000 koin (Rp10.000)</p>
  <div class="card">
    <h3>Saldo</h3>
    <p style="font-size:2rem;font-weight:800;color:var(--accent2)" id="saldo">🪙 0</p>
  </div>
  <div class="card">
    <h3 style="margin-bottom:16px">Form Withdraw</h3>
    <div class="input-group"><label class="muted small">Jumlah koin (min 10.000)</label><input id="wd-coins" type="number" min="10000" step="1000" value="10000"></div>
    <div class="input-group"><label class="muted small">Metode</label><select id="wd-method"><option>DANA</option><option>OVO</option><option>GoPay</option><option>Bank</option></select></div>
    <div class="input-group"><label class="muted small">Nama Pemilik</label><input id="wd-name" type="text" placeholder="Nama rekening"></div>
    <div class="input-group"><label class="muted small">Nomor HP / Rekening</label><input id="wd-acc" type="text" placeholder="08xxx"></div>
    <button class="btn primary" id="btn-withdraw" style="width:100%">Ajukan Withdraw</button>
  </div>
  <h2 style="margin-top:32px">Riwayat</h2>
  <ul class="history" id="wd-history" style="margin-top:12px"><li><span>Belum ada pengajuan.</span></li></ul>
</main>
<script>
document.addEventListener('DOMContentLoaded', () => setTimeout(initWithdrawPage, 1000));
async function initWithdrawPage() {
  if (!currentUser) {
    document.getElementById('saldo').textContent = '🔐 Login dulu';
    document.getElementById('btn-withdraw').onclick = () => ensureLogin().then(() => location.reload());
    return;
  }
  document.getElementById('saldo').textContent = '🪙 ' + (state.coins || 0);
  document.getElementById('btn-withdraw').onclick = async () => {
    const n = parseInt(document.getElementById('wd-coins').value) || 0;
    if (n < 10000) return alert('Minimal 10.000 koin');
    if (n > (state.coins||0)) return alert('Koin tidak cukup');
    const { collection, addDoc, serverTimestamp } = await f();
    await addDoc(collection(FB.db, 'withdrawals'), {
      uid: currentUser.uid, email: currentUser.email || '', coins: n, rupiah: n,
      method: document.getElementById('wd-method').value, 
      accountName: document.getElementById('wd-name').value.trim(), 
      accountNumber: document.getElementById('wd-acc').value.trim(),
      status: 'pending', createdAt: serverTimestamp()
    });
    await saveUserState({ coins: state.coins - n });
    alert('✅ Pengajuan terkirim.'); location.reload();
  };
}
</script><footer><p>© 2026 Duniamu · Dibuat untuk pembaca Indonesia</p></footer>
