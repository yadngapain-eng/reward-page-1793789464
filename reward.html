
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reward - DUNIAMU</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><a href="index.html" style="font-size:1.5rem;">←</a><div class="logo">Reward</div><div style="width:24px;"></div></header>
  <div class="container">
    <div class="card" style="text-align:center;">
      <h3>Klaim Koin Gratis</h3>
      <p style="color: var(--muted); margin: 10px 0;">Tonton iklan singkat untuk mendapatkan 20 Koin.</p>
      <button class="btn btn-accent" onclick="klaimKoin()">Tonton Iklan (+20 🪙)</button>
    </div>
  </div>
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item"><span class="nav-icon">🏠</span>Beranda</a>
    <a href="reward.html" class="nav-item active"><span class="nav-icon">🎁</span>Reward</a>
    <a href="profile.html" class="nav-item"><span class="nav-icon">👤</span>Profil</a>
  </nav>
  <script>
    function klaimKoin() {
      window.open('https://araplhn.org/4/f15341dc4ed341cc62411d69d314d518', '_blank');
      setTimeout(() => {
        let coins = parseInt(localStorage.getItem("duniamu_coins")) || 0;
        coins += 20;
        localStorage.setItem("duniamu_coins", coins);
        alert("Berhasil! +20 Koin ditambahkan.");
        window.location.href = "index.html";
      }, 3000);
    }
  </script>
</body>
</html>
