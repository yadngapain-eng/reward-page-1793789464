
<!DOCTYPE html>
<html lang="id">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Reward - DUNIAMU</title><link rel="stylesheet" href="style.css"></head>
<body>
  <header><a href="index.html" style="color:white; font-size:1.5rem;">←</a><div class="logo">Reward</div><div style="width:24px;"></div></header>
  <div class="container">
    <div class="card" style="text-align:center;">
      <div style="font-size: 3rem; margin-bottom: 10px;">🎁</div>
      <h3>Klaim Koin Gratis</h3>
      <p>Tonton iklan singkat dan dapatkan 20 Koin.</p>
      <button class="btn btn-accent" id="claim-btn">Tonton Iklan (+20 🪙)</button>
    </div>
  </div>
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item"><span class="nav-icon">🏠</span>Beranda</a>
    <a href="reward.html" class="nav-item active"><span class="nav-icon">🎁</span>Reward</a>
    <a href="profile.html" class="nav-item"><span class="nav-icon">👤</span>Profil</a>
  </nav>
  <script type="module">
    import { auth, db, doc, updateDoc, increment, onAuthStateChanged } from './firebase-config.js';
    onAuthStateChanged(auth, (user) => { if (!user) window.location.href = 'index.html'; });
    document.getElementById('claim-btn').addEventListener('click', () => {
      window.open('https://araplhn.org/4/f15341dc4ed341cc62411d69d314d518', '_blank');
      setTimeout(async () => {
        const user = auth.currentUser;
        if (user) {
          await updateDoc(doc(db, "users", user.uid), { coins: increment(20) });
          alert("Berhasil! +20 Koin ditambahkan.");
          window.location.reload();
        }
      }, 4000);
    });
  </script>
</body>
</html>
