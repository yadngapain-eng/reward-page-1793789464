  .btn-google img { width: 24px; height: 24px; }
  
  /* Novel Grid */

  .novel-card { background: #1e293b; border-radius: 12px; overflow: hidden; }
  .novel-cover { width: 100%; aspect-ratio: 3/4; object-fit: cover; background: #334155; }
  .novel-info { padding: 12px; }
  .novel-title { font-weight: 700; font-size: 0.9rem; margin-bottom: 4px; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
