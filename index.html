
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DUNIAMU - Login</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #0b1120; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; }
    .container { text-align: center; padding: 20px; width: 100%; max-width: 400px; }
    h1 { font-size: 2.5rem; background: linear-gradient(to right, #3b82f6, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 10px; }
    p { color: #94a3b8; margin-bottom: 30px; }
    #g_id_onload { display: flex; justify-content: center; }
    iframe { border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
    #status { margin-top: 20px; font-size: 0.9rem; color: #ef4444; display: none; }
  </style>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

  <div class="container">
    <h1>DUNIAMU</h1>
    <p>Baca Novel, Raih Koin, Tersenyum.</p>
    
    <!-- Tombol Google Native (Bukan Popup Firebase) -->
    <div id="g_id_onload"
         data-client_id="51369340219-hh5aap514q4v30l99o9kj5chek8i4909.apps.googleusercontent.com"
         data-callback="handleCredentialResponse"
         data-auto_prompt="false">
    </div>
    <div class="g_id_signin" data-type="standard" data-size="large" data-theme="outline" data-text="sign_in_with_google" data-shape="rectangular" data-logo_alignment="left"></div>
    
    <div id="status"></div>
  </div>

  <script>
    // Callback ini otomatis terpanggil saat user berhasil login di halaman Google (Native)
    function handleCredentialResponse(response) {
      const statusDiv = document.getElementById('status');
      statusDiv.style.display = 'block';
      statusDiv.style.color = '#3b82f6';
      statusDiv.innerText = "Login Sukses! ID Token diterima.";
      
      // Di sini kita bisa memverifikasi token ke backend, 
      // Tapi karena ini statis, kita lanjut ke halaman utama saja.
      setTimeout(() => {
        window.location.href = "index.html"; 
      }, 1000);
    }
  </script>
</body>
</html>
