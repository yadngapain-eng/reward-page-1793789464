<script>
  document.addEventListener('DOMContentLoaded', () => {
    const btn = document.getElementById('menu-btn');
    const dd = document.getElementById('dropdown');
    if(btn && dd) {
      btn.onclick = (e) => { e.stopPropagation(); dd.style.display = dd.style.display === 'flex' ? 'none' : 'flex'; };
      document.addEventListener('click', (e) => { if(!dd.contains(e.target) && !btn.contains(e.target)) dd.style.display = 'none'; });
    }
  });
</script>

<main class="section">
  <h1>Library Saya</h1>
  <p class="muted" style="margin-bottom:20px">Novel yang kamu simpan.</p>
  <div class="grid" id="library-grid"></div>
  <div id="library-empty" style="text-align:center;padding:40px">
