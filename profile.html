
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil - DUNIAMU</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background-color: #0b1120; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; padding-bottom: 80px; }
    header { display: flex; justify-content: center; align-items: center; padding: 16px 20px; background: #1e293b; position: sticky; top: 0; z-index: 100; }
    .container { padding: 20px; max-width: 600px; margin: 0 auto; width: 100%; flex: 1; }
    .card { background: #1e293b; border-radius: 16px; padding: 30px 20px; margin-bottom: 16px; text-align: center; border: 1px solid rgba(255,255,255,0.05); }
    .avatar { width: 90px; height: 90px; border-radius: 50%; margin-bottom: 15px; background: #334155; border: 3px solid #3b82f6; object-fit: cover; }
    .btn { width: 100%; padding: 14px; border-radius: 12px; border: none; font-weight: 700; font-size: 1rem; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px; }
    .btn-google { background: white; color: #1e293b; margin-top: 15px; }
    .btn-danger { background: #ef4444; color: white; margin-top: 15px; }
    .coin-box { background: rgba(245, 158, 11, 0.1); border: 1px solid rgba(245, 158, 11, 0.3); border-radius: 12px; padding: 15px; margin-top: 15px; }
    .bottom-nav { position: fixed; bottom: 0; width: 100%; display: flex; justify-content: space-around; background: #1e293b; padding: 12px 0 20px; border-top: 1px solid rgba(255,255,255,0.05); }
    .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 0.75rem; color: #94a3b8; text-decoration: none; gap: 4px; }
    .nav-item.active { color: #3b82f6; }
  </style>
</head>
<body>
  <header><a href="index.html" style="position:absolute; left:20px; color:white; font-size:1.5rem; text-decoration:none;">←</a><div style="font-weight:bold;">Profil</div></header>
  <div class="container">
    <div class="card" id="profile-card">
      <!-- Tampilan Default Langsung Muncul -->
      <img src="https://ui-avatars.com/api/?name=Tamu&background=334155&color=fff&size=90" class="avatar">
      <h3>Pengguna Tamu</h3>
      <p style="color: #94a3b8; font-size: 0.9rem; margin-bottom: 5px;">Kamu belum login</p>
      <button class="btn btn-google" id="login-btn">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" style="width:20px;"> Login dengan Google
      </button>
      <div id="error-msg" style="color: #ef4444; font-size: 0.8rem; margin-top: 10px; display: none;"></div>
    </div>
  </div>
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item"><span>🏠</span>Beranda</a>
    <a href="reward.html" class="nav-item"><span>🎁</span>Reward</a>
    <a href="profile.html" class="nav-item active"><span>👤</span>Profil</a>
  </nav>

  <script type="module">
    // Import langsung dari CDN tanpa perantara firebase-config.js
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Konfigurasi Duniaku
    const firebaseConfig = {
      apiKey: "AIzaSyAWjB5Db2FVIYlnRnd5ykVoNAfZoboCKl4",
      authDomain: "duniaku.firebaseapp.com",
      projectId: "duniaku",
      storageBucket: "duniaku.firebasestorage.app",
      messagingSenderId: "1070116102039",
      appId: "1:1070116102039:web:2269553c0d27b2c64b6ed2"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    const profileCard = document.getElementById('profile-card');

    // Logika Tombol Login
    document.getElementById('login-btn').addEventListener('click', async () => {
      const btn = document.getElementById('login-btn');
      const err = document.getElementById('error-msg');
      btn.innerText = "Memproses...";
      err.style.display = 'none';
      try {
        await signInWithPopup(auth, provider);
      } catch (error) {
        btn.innerHTML = '<img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" style="width:20px;"> Login dengan Google';
        err.style.display = 'block';
        err.innerText = "Gagal: " + error.message;
      }
    });

    // Pantau Status Login
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        const userRef = doc(db, "users", user.uid);
        const userSnap = await getDoc(userRef);
        let coinData = 100;
        
        if (!userSnap.exists()) {
          let guestCoins = parseInt(localStorage.getItem("duniamu_coins") || "100");
          coinData = guestCoins;
          await setDoc(userRef, { email: user.email, coins: guestCoins, createdAt: new Date() });
        } else {
          coinData = userSnap.data().coins;
        }

        profileCard.innerHTML = `
          <img src="${user.photoURL || 'https://ui-avatars.com/api/?name='+user.email+'&background=3b82f6&color=fff&size=90'}" class="avatar">
          <h3>${user.displayName || 'Pengguna DUNIAMU'}</h3>
          <p style="color: #94a3b8; font-size: 0.9rem; margin-bottom: 5px;">${user.email}</p>
          <div class="coin-box">
            <div style="font-size: 0.8rem; color: #94a3b8;">Total Koin</div>
            <div style="font-size: 1.8rem; font-weight: 800; color: #f59e0b;">🪙 ${coinData}</div>
          </div>
          <button class="btn btn-danger" id="logout-btn">Logout</button>
        `;

        document.getElementById('logout-btn').addEventListener('click', async () => {
          await signOut(auth);
          window.location.reload(); // Refresh untuk reset UI
        });
      }
    });
  </script>
</body>
</html>
