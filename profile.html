
<!DOCTYPE html>
<html lang="id">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Profil - DUNIAMU</title><link rel="stylesheet" href="style.css"></head>
<body>
  <header><a href="index.html" style="font-size:1.5rem;">←</a><div class="logo">Profil</div><div style="width:24px;"></div></header>
  <div class="container">
    <div class="card" id="profile-card" style="text-align:center; padding: 30px 20px;">
      <div id="loading">Memuat profil...</div>
    </div>
  </div>
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item"><span class="nav-icon">🏠</span>Beranda</a>
    <a href="reward.html" class="nav-item"><span class="nav-icon">🎁</span>Reward</a>
    <a href="profile.html" class="nav-item active"><span class="nav-icon">👤</span>Profil</a>
  </nav>

  <script type="module">
    import { auth, db } from './firebase-config.js';
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const profileCard = document.getElementById('profile-card');

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        // Jika belum login, redirect ke halaman login
        window.location.href = "login.html";
      } else {
        const userRef = doc(db, "users", user.uid);
        const userSnap = await getDoc(userRef);
        let coins = 100;

        if (!userSnap.exists()) {
          // User baru: Ambil koin dari localStorage, simpan ke Firestore
          let localCoins = parseInt(localStorage.getItem("duniamu_coins")) || 100;
          coins = localCoins;
          await setDoc(userRef, { email: user.email, coins: coins, createdAt: new Date() });
        } else {
          coins = userSnap.data().coins;
        }

        profileCard.innerHTML = `
          <img src="${user.photoURL || 'https://ui-avatars.com/api/?name='+user.email+'&background=3b82f6&color=fff&size=90'}" style="width: 90px; height: 90px; border-radius: 50%; margin-bottom: 15px; object-fit: cover; border: 3px solid #3b82f6;">
          <h3>${user.displayName || 'Pengguna DUNIAMU'}</h3>
          <p style="color: #94a3b8; font-size: 0.9rem; margin-bottom: 15px;">${user.email}</p>
          <div style="background: rgba(245, 158, 11, 0.1); border: 1px solid rgba(245, 158, 11, 0.3); border-radius: 12px; padding: 15px; margin-bottom: 15px;">
            <div style="font-size: 0.8rem; color: #94a3b8;">Total Koin</div>
            <div style="font-size: 1.8rem; font-weight: 800; color: #f59e0b;">🪙 ${coins}</div>
          </div>
          <button class="btn btn-danger" id="logout-btn">Logout</button>
        `;

        document.getElementById('logout-btn').addEventListener('click', async () => {
          await signOut(auth);
          window.location.href = "login.html";
        });
      }
    });
  </script>
</body>
</html>
