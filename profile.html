<link rel="stylesheet" href="ads/ads.css"/><link rel="stylesheet" href="style.css"/></head><body>
<header class="topbar">
  <a class="brand" href="index.html">🌌 Duniamu</a>
  <nav class="nav">
    <a href="index.html" >Beranda</a>
    <a href="library.html" >Library</a>
    <a href="reward.html" >Reward</a>
    <a href="withdraw.html" >Withdraw</a>
    <a href="profile.html" class="active">Profil</a>
  </nav>
  <div class="topbar-right">
    <a href="profile.html" class="btn-user" id="btn-user-status">🔐 Login</a>
    <button class="menu-btn" id="menu-btn">☰</button>
    <div class="dropdown" id="dropdown">
      <a href="index.html" >🏠 Beranda</a>
      <a href="library.html" >📚 Library</a>
      <a href="reward.html" >🎁 Reward</a>
      <a href="withdraw.html" >💸 Withdraw</a>
      <a href="profile.html" class="active">👤 Profil</a>
    </div>
  </div>
</header>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const btn = document.getElementById('menu-btn');
    const dd = document.getElementById('dropdown');
    if(btn && dd) {
      btn.onclick = (e) => { e.stopPropagation(); dd.style.display = dd.style.display === 'flex' ? 'none' : 'flex'; };
      document.addEventListener('click', (e) => { if(!dd.contains(e.target) && !btn.contains(e.target)) dd.style.display = 'none'; });
    }
  });
</script>

<main class="section">
  <div class="profile-card">
    <div class="avatar">🧑‍🚀</div>
    <div class="profile-info">
      <h1 id="profile-name">Memuat...</h1>
      <p class="muted" id="profile-stats">-</p>
    </div>
    <div class="profile-actions">
      <button class="btn primary" id="btn-reset">Memuat...</button>
    </div>
  </div>
  <h2>Riwayat Reward</h2>
  <ul class="history" id="history-list" style="margin-top:12px"><li><span>Memuat...</span></li></ul>
</main><footer><p>© 2026 Duniamu · Dibuat untuk pembaca Indonesia</p></footer>
<script src="firebase-config.js"></script>

</body></html>
