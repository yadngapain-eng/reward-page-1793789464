
name: Build Admin APK
on:
  push:
    branches: [ "main" ]
    paths:
      - 'admin_app/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.0'
        channel: 'stable'
        cache: true

    - name: Create Android Structure
      run: |
        cd admin_app
        flutter create . --platforms=android

    - name: Copy google-services.json & Keystore
      run: |
        # Salin file config dan keystore yang sudah disiapkan di repo
        cp admin_app/google-services.json admin_app/android/app/google-services.json
        cp admin_app/android/app/debug.keystore admin_app/android/app/debug.keystore

    - name: Setup Gradle for Firebase
      run: |
        cd admin_app/android
        # Tambahkan plugin google-services
        sed -i '/id "com.android.application"/a\    id "com.google.gms.google-services"' app/build.gradle
        # Paksa gunakan debug.keystore kita
        sed -i '/signingConfig = signingConfigs.debug/i\        storeFile file("debug.keystore")\n        storePassword "android"\n        keyAlias "androiddebugkey"\n        keyPassword "android"' app/build.gradle

    - name: Install dependencies
      run: |
        cd admin_app
        flutter pub get

    - name: Build APK
      run: |
        cd admin_app
        flutter build apk --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: duniamu-admin-apk
        path: admin_app/build/app/outputs/flutter-apk/app-release.apk
