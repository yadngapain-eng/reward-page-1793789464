
name: Build Admin APK
on:
  push:
    branches: [ "main" ]
    paths:
      - 'admin_app/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.0'
        channel: 'stable'
        cache: true

    - name: Create Android Structure
      run: |
        cd admin_app
        flutter create . --platforms=android

    - name: Configure Firebase & Keystore
      run: |
        cd admin_app
        
        # 1. Pindahkan google-services.json ke folder android
        cp google-services.json android/app/google-services.json
        
        # 2. Pindahkan keystore (hanya jika filenya ada di root, jika tidak abaikan)
        if [ -f debug.keystore ]; then
          cp debug.keystore android/app/debug.keystore
        fi
        
        # 3. Daftarkan plugin Google Services di build.gradle
        sed -i '/id "com.android.application"/a\    id "com.google.gms.google-services"' android/app/build.gradle
        
        # 4. Tambahkan classpath google-services di build.gradle root
        sed -i '/buildscript {/a\    dependencies {\n        classpath "com.google.gms:google-services:4.4.0"\n    }' android/build.gradle

    - name: Install dependencies
      run: |
        cd admin_app
        flutter pub get

    - name: Build APK
      run: |
        cd admin_app
        flutter build apk --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: duniamu-admin-apk
        path: admin_app/build/app/outputs/flutter-apk/app-release.apk
