name: Build Admin APK

on:
  push:
    branches: [ "main" ]
    paths:
      - 'admin_app/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
          cache: true

      - name: Create Android Structure
        working-directory: admin_app
        run: flutter create . --platforms=android --project-name=admin_app

      - name: Configure Firebase & Keystore
        working-directory: admin_app
        run: |
          cp google-services.json android/app/google-services.json

          if [ -f debug.keystore ]; then
            cp debug.keystore android/app/debug.keystore
          fi

          # Generated by Flutter 3.19 already has com.android.application in the plugins block.
          sed -i '/id "com.android.application"/a\    id "com.google.gms.google-services" version "4.4.0"' android/app/build.gradle

      - name: Install dependencies
        working-directory: admin_app
        run: flutter pub get

      - name: Build APK
        working-directory: admin_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: duniamu-admin-apk
          path: admin_app/build/app/outputs/flutter-apk/app-release.apk
