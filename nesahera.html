<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex,nofollow"/>
<title>Admin - Duniamu</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:#0a0e1a;color:#e5eefc;min-height:100vh;padding:20px}
.login{max-width:380px;margin:100px auto;background:#121a2b;border:1px solid #1f2a44;border-radius:16px;padding:32px;display:flex;flex-direction:column;gap:14px}
h1{font-size:22px;color:#00e0ff}
input,select{padding:12px;border:1px solid #1f2a44;border-radius:8px;background:#0a0e1a;color:#fff;width:100%;margin-bottom:10px}
button{padding:12px;border:none;border-radius:8px;background:#00e0ff;color:#000;font-weight:800;cursor:pointer}
#app{display:none;max-width:900px;margin:0 auto}
.tabs{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.tab{padding:10px 20px;background:#121a2b;color:#fff;border:1px solid #1f2a44;border-radius:8px;cursor:pointer}
.tab.active{background:#00e0ff;color:#000;font-weight:bold}
.panel{display:none;background:#121a2b;border:1px solid #1f2a44;border-radius:12px;padding:20px}
.panel.active{display:block}
.item{display:flex;gap:10px;margin-bottom:10px;background:#0a0e1a;padding:10px;border-radius:8px;flex-wrap:wrap}
.item input{flex:1;min-width:100px}
.btn-danger{background:#ef4444;color:#fff}
.btn-ok{background:#22c55e;color:#fff}
table{width:100%;border-collapse:collapse;margin-top:15px}
th,td{border-bottom:1px solid #1f2a44;padding:10px;text-align:left;font-size:14px}
.badge{padding:2px 8px;border-radius:6px;font-size:11px;text-transform:uppercase}
.badge.pending{background:#f59e0b;color:#000}
.badge.approved,.badge.paid{background:#22c55e;color:#000}
.badge.rejected{background:#ff2d55;color:#fff}
</style>
</head>
<body>

<div class="login" id="loginBox">
  <h1>Admin Login</h1>
  <input id="adminEmail" type="email" placeholder="Email admin"/>
  <input id="adminPass" type="password" placeholder="Password"/>
  <button id="loginBtn">Masuk</button>
  <p id="loginMsg" style="color:#ff2d55;font-size:13px"></p>
</div>

<div id="app">
  <h1 style="margin-bottom:20px">Admin Dashboard</h1>
  <div class="tabs">
    <div class="tab active" data-tab="missions">Misi</div>
    <div class="tab" data-tab="payments">Metode Withdraw</div>
    <div class="tab" data-tab="claims">Klaim User</div>
    <div class="tab" data-tab="withdrawals">Withdraw</div>
  </div>

  <div class="panel active" id="panel-missions">
    <h2>Daftar Misi</h2>
    <div id="missionList"></div>
    <button onclick="addMission()" style="margin-bottom:20px">+ Tambah Misi</button>
    <button onclick="saveMissions()" style="background:#22c55e;color:#fff">Simpan ke Firebase</button>
  </div>

  <div class="panel" id="panel-payments">
    <h2>Metode Withdraw</h2>
    <div id="paymentList"></div>
    <button onclick="addPayment()" style="margin-bottom:20px">+ Tambah Metode</button>
    <button onclick="savePayments()" style="background:#22c55e;color:#fff">Simpan ke Firebase</button>
  </div>

  <div class="panel" id="panel-claims">
    <h2>Daftar Klaim</h2>
    <div id="claimsWrap"></div>
  </div>

  <div class="panel" id="panel-withdrawals">
    <h2>Permintaan Withdraw</h2>
    <div id="withdrawalsWrap"></div>
  </div>
</div>

<script type="module">
import { db, auth } from './firebase-config.js';
import {
  doc, getDoc, setDoc, collection, onSnapshot,
  deleteDoc, updateDoc, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
import {
  signInWithEmailAndPassword, onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

const $ = id => document.getElementById(id);
const fmt = n => 'Rp ' + Number(n || 0).toLocaleString('id-ID');
let CONFIG = null;

onAuthStateChanged(auth, async (u) => {
  if (!u) { $('loginBox').style.display='flex'; $('app').style.display='none'; return; }
  const token = await u.getIdTokenResult();
  if (token.claims.admin !== true) {
    $('loginMsg').textContent = 'Akun ini bukan admin.';
    await signOut(auth); return;
  }
  $('loginBox').style.display='none';
  $('app').style.display='block';
  await loadConfig(); renderAll(); listenClaims(); listenWithdrawals();
});

$('loginBtn').onclick = async () => {
  try { await signInWithEmailAndPassword(auth, $('adminEmail').value, $('adminPass').value); }
  catch (e) { $('loginMsg').textContent = e.message; }
};

document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  document.getElementById('panel-' + t.dataset.tab).classList.add('active');
});

async function loadConfig() {
  const snap = await getDoc(doc(db, "settings", "global"));
  CONFIG = snap.exists() ? snap.data() : { missions: [], payments: [] };
  if (!CONFIG.missions) CONFIG.missions = [];
  if (!CONFIG.payments) CONFIG.payments = [];
}

function renderAll() {
  const mWrap = $('missionList'); mWrap.innerHTML = '';
  (CONFIG.missions || []).forEach((m, i) => {
    const el = document.createElement('div'); el.className = 'item';
    el.innerHTML =
      '<input value="' + (m.title||'').replace(/"/g,'&quot;') + '" onchange="CONFIG.missions[' + i + '].title=this.value" placeholder="Judul Misi"/>' +
      '<input type="number" value="' + (m.reward||0) + '" onchange="CONFIG.missions[' + i + '].reward=+this.value" style="max-width:90px"/>' +
      '<input value="' + (m.link||'').replace(/"/g,'&quot;') + '" onchange="CONFIG.missions[' + i + '].link=this.value" placeholder="Link (opsional)"/>' +
      '<button class="btn-danger" onclick="CONFIG.missions.splice(' + i + ',1);renderAll()">Hapus</button>';
    mWrap.appendChild(el);
  });

  const pWrap = $('paymentList'); pWrap.innerHTML = '';
  (CONFIG.payments || []).forEach((p, i) => {
    const el = document.createElement('div'); el.className = 'item';
    el.innerHTML =
      '<input value="' + (p.name||'').replace(/"/g,'&quot;') + '" onchange="CONFIG.payments[' + i + '].name=this.value" placeholder="Nama (DANA/OVO)"/>' +
      '<input value="' + (p.holder||'').replace(/"/g,'&quot;') + '" onchange="CONFIG.payments[' + i + '].holder=this.value" placeholder="Atas Nama"/>' +
      '<label style="display:flex;align-items:center;gap:5px;color:#fff"><input type="checkbox" ' + (p.active?'checked':'') + ' onchange="CONFIG.payments[' + i + '].active=this.checked"/> Aktif</label>' +
      '<button class="btn-danger" onclick="CONFIG.payments.splice(' + i + ',1);renderAll()">Hapus</button>';
    pWrap.appendChild(el);
  });
}

window.addMission = () => { CONFIG.missions.push({ id: Date.now(), title: '', reward: 10, link: '' }); renderAll(); };
window.addPayment = () => { CONFIG.payments.push({ id: Date.now(), name: '', holder: '', active: true }); renderAll(); };
window.saveMissions = async () => {
  await setDoc(doc(db, "settings", "global"), { missions: CONFIG.missions }, { merge: true });
  alert('Misi disimpan!');
};
window.savePayments = async () => {
  await setDoc(doc(db, "settings", "global"), { payments: CONFIG.payments }, { merge: true });
  alert('Metode disimpan!');
};

function listenClaims() {
  onSnapshot(collection(db, "claims"), snap => {
    const wrap = $('claimsWrap');
    if (snap.empty) { wrap.innerHTML = '<p>Belum ada klaim.</p>'; return; }
    let html = '<table><tr><th>Nama</th><th>Kontak</th><th>Poin</th><th>Metode</th><th>Status</th><th>Aksi</th></tr>';
    snap.forEach(d => {
      const c = d.data();
      html +=
        '<tr><td>' + (c.name||'-') + '</td>' +
        '<td>' + (c.contact||'-') + '</td>' +
        '<td>' + (c.totalPoin||0) + '</td>' +
        '<td>' + (c.paymentMethod||'-') + '</td>' +
        '<td><span class="badge ' + c.status + '">' + c.status + '</span></td>' +
        '<td>' +
          '<button class="btn-ok" onclick="markClaim(\'' + d.id + '\',\'approved\')">Setujui</button>' +
          '<button class="btn-danger" onclick="markClaim(\'' + d.id + '\',\'rejected\')">Tolak</button>' +
          '<button class="btn-danger" onclick="delClaim(\'' + d.id + '\')">Hapus</button>' +
        '</td></tr>';
    });
    wrap.innerHTML = html + '</table>';
  });
}
window.markClaim = async (id, status) => {
  await updateDoc(doc(db, "claims", id), { status, processedAt: serverTimestamp() });
};
window.delClaim = async (id) => {
  if (confirm('Hapus klaim ini?')) await deleteDoc(doc(db, "claims", id));
};

function listenWithdrawals() {
  onSnapshot(collection(db, "withdrawals"), snap => {
    const wrap = $('withdrawalsWrap');
    if (snap.empty) { wrap.innerHTML = '<p>Belum ada permintaan.</p>'; return; }
    let html = '<table><tr><th>Jumlah</th><th>Metode</th><th>Rekening</th><th>Status</th><th>Aksi</th></tr>';
    snap.forEach(d => {
      const w = d.data();
      html +=
        '<tr><td>' + fmt(w.amount) + '</td>' +
        '<td>' + (w.method||'-') + '</td>' +
        '<td>' + (w.accountName||'') + ' - ' + (w.accountNumber||'') + '</td>' +
        '<td><span class="badge ' + w.status + '">' + w.status + '</span></td>' +
        '<td>' +
          '<button class="btn-ok" onclick="markWd(\'' + d.id + '\',\'paid\')">Bayar</button>' +
          '<button class="btn-ok" onclick="markWd(\'' + d.id + '\',\'approved\')">Setujui</button>' +
          '<button class="btn-danger" onclick="markWd(\'' + d.id + '\',\'rejected\')">Tolak</button>' +
        '</td></tr>';
    });
    wrap.innerHTML = html + '</table>';
  });
}
window.markWd = async (id, status) => {
  await updateDoc(doc(db, "withdrawals", id), { status, processedAt: serverTimestamp() });
};
</script>
</body>
</html>
