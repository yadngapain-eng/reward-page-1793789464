<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex,nofollow"/>
<title>Admin - Duniamu</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:#0a0e1a;color:#e5eefc;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login{max-width:380px;width:100%;background:#121a2b;border:1px solid #1f2a44;border-radius:16px;padding:32px;display:flex;flex-direction:column;gap:16px;text-align:center}
h1{font-size:22px;color:#00e0ff;margin-bottom:8px}
p.sub{color:#7d8ba3;font-size:13px;margin-bottom:10px}
button{padding:12px;border:none;border-radius:8px;background:#00e0ff;color:#000;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;transition:0.2s}
button:hover:not(:disabled){filter:brightness(1.1)}
button:disabled{opacity:.5;cursor:not-allowed}
#app{display:none;width:100%;max-width:900px;margin:0 auto}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.tabs{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.tab{padding:10px 20px;background:#121a2b;color:#fff;border:1px solid #1f2a44;border-radius:8px;cursor:pointer;font-size:14px}
.tab.active{background:#00e0ff;color:#000;font-weight:bold}
.panel{display:none;background:#121a2b;border:1px solid #1f2a44;border-radius:12px;padding:20px}
.panel.active{display:block}
/* CSS Form Tambah Misi */
.form-group{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.form-group label{font-size:12px;color:#7d8ba3;font-weight:700;text-transform:uppercase}
.form-group input{padding:12px;border-radius:8px;border:1px solid #1f2a44;background:#0a0e1a;color:#fff;font-size:14px;width:100%}
/* CSS Daftar Misi (Tabel) */
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{border-bottom:1px solid #1f2a44;padding:12px 10px;text-align:left;font-size:14px}
th{color:#7d8ba3;font-size:12px;text-transform:uppercase}
.btn-sm{padding:6px 12px;width:auto;font-size:12px;border-radius:6px}
.btn-danger{background:#ef4444;color:#fff}
.btn-ok{background:#22c55e;color:#fff}
.badge{padding:2px 8px;border-radius:6px;font-size:11px;text-transform:uppercase}
.badge.pending{background:#f59e0b;color:#000}
.badge.approved,.badge.paid{background:#22c55e;color:#000}
.badge.rejected{background:#ff2d55;color:#fff}
.img-proof{width:60px;height:60px;object-fit:cover;border-radius:6px;cursor:pointer;border:1px solid #1f2a44}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);background:#22c55e;color:#000;padding:14px 24px;border-radius:12px;font-weight:800;opacity:0;transition:.3s;z-index:9999;box-shadow:0 10px 30px rgba(0,0,0,0.5);display:flex;align-items:center;gap:10px;}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.error{background:#ef4444;color:#fff}
</style>
</head>
<body>

<div class="login" id="loginBox">
  <h1>Admin Login</h1>
  <p class="sub">Akses khusus administrator.</p>
  <button id="googleLoginBtn">
    <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.3-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.3 0-9.7-3.1-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.1-4.1 5.6l6.2 5.2C41 35.1 44 30 44 24c0-1.3-.1-2.3-.4-3.5z"/></svg>
    Masuk dengan Google
  </button>
  <p id="loginMsg" style="color:#ff2d55;font-size:13px"></p>
</div>

<div id="app">
  <div class="header">
    <h1>Admin Dashboard</h1>
    <button onclick="logout()" style="width:auto;padding:8px 16px;background:#1f2a44;color:#fff">Logout</button>
  </div>
  
  <div class="tabs">
    <div class="tab active" data-tab="list-missions">Daftar Misi</div>
    <div class="tab" data-tab="add-mission">+ Tambah Misi</div>
    <div class="tab" data-tab="payments">Metode Withdraw</div>
    <div class="tab" data-tab="claims">Klaim User</div>
    <div class="tab" data-tab="withdrawals">Withdraw</div>
  </div>

  <!-- TAB 1: DAFTAR MISI (EDIT & HAPUS) -->
  <div class="panel active" id="panel-list-missions">
    <h2>Daftar Misi Aktif</h2>
    <p class="sub" style="margin-bottom:15px">Edit data di bawah lalu klik "Simpan Perubahan".</p>
    <div id="missionListWrap"></div>
    <button id="btnSaveMissions" onclick="saveEditedMissions()" style="background:#22c55e;color:#fff;margin-top:20px">Simpan Perubahan</button>
  </div>

  <!-- TAB 2: TAMBAH MISI BARU -->
  <div class="panel" id="panel-add-mission">
    <h2>Tambah Misi Baru</h2>
    <div class="form-group">
      <label>Judul Misi</label>
      <input id="newMissionTitle" type="text" placeholder="Contoh: Follow Instagram @duniamu"/>
    </div>
    <div class="form-group">
      <label>Reward (Poin)</label>
      <input id="newMissionReward" type="number" value="10" placeholder="10"/>
    </div>
    <div class="form-group">
      <label>Link Tujuan (Opsional)</label>
      <input id="newMissionLink" type="text" placeholder="https://instagram.com/..."/>
    </div>
    <button onclick="submitNewMission()" style="background:#00e0ff;color:#000;margin-top:10px">Simpan Misi Baru</button>
  </div>

  <!-- TAB 3: METODE WITHDRAW -->
  <div class="panel" id="panel-payments">
    <h2>Metode Withdraw</h2>
    <div id="paymentList"></div>
    <button onclick="addPayment()" style="margin-bottom:20px;width:auto;margin-top:10px">+ Tambah Metode</button>
    <button id="btnSavePayments" onclick="savePayments()" style="background:#22c55e;color:#fff;width:auto">Simpan ke Firebase</button>
  </div>

  <!-- TAB 4: KLAIM USER -->
  <div class="panel" id="panel-claims">
    <h2>Daftar Klaim</h2>
    <div id="claimsWrap"></div>
  </div>

  <!-- TAB 5: WITHDRAW -->
  <div class="panel" id="panel-withdrawals">
    <h2>Permintaan Withdraw</h2>
    <div id="withdrawalsWrap"></div>
  </div>
</div>

<div class="toast" id="toast">
  <span id="toastIcon">✅</span>
  <span id="toastMsg">Berhasil!</span>
</div>

<script type="module">
import { db, auth } from './firebase-config.js';
import {
  doc, getDoc, setDoc, collection, onSnapshot,
  deleteDoc, updateDoc, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
import {
  GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

const $ = id => document.getElementById(id);
const fmt = n => 'Rp ' + Number(n || 0).toLocaleString('id-ID');
const ADMIN_EMAIL = "yadngapain@gmail.com";
let CONFIG = { missions: [], payments: [] };

// === TOAST ===
function showToast(msg, isError = false) {
  const t = $('toast');
  $('toastMsg').textContent = msg;
  $('toastIcon').textContent = isError ? '❌' : '✅';
  if (isError) t.classList.add('error');
  else t.classList.remove('error');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

// === LOGIN ===
const provider = new GoogleAuthProvider();
provider.setCustomParameters({ prompt: 'select_account' });

$('googleLoginBtn').onclick = async () => {
  try {
    const result = await signInWithPopup(auth, provider);
    if (result.user.email !== ADMIN_EMAIL) {
      await signOut(auth);
      $('loginMsg').textContent = 'Akses ditolak. Anda bukan admin.';
    }
  } catch (e) {
    $('loginMsg').textContent = e.message;
  }
};

window.logout = async () => { await signOut(auth); };

onAuthStateChanged(auth, async (u) => {
  if (!u) {
    $('loginBox').style.display = 'flex';
    $('app').style.display = 'none';
    return;
  }
  if (u.email !== ADMIN_EMAIL) {
    $('loginMsg').textContent = 'Akses ditolak.';
    await signOut(auth);
    return;
  }
  
  $('loginBox').style.display = 'none';
  $('app').style.display = 'block';
  
  await loadDataFromFirebase();
  listenClaims();
  listenWithdrawals();
});

// === TABS ===
document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  document.getElementById('panel-' + t.dataset.tab).classList.add('active');
});

// === LOAD DATA ===
async function loadDataFromFirebase() {
  try {
    const snap = await getDoc(doc(db, "settings", "global"));
    if (snap.exists()) {
      const data = snap.data();
      CONFIG.missions = Array.isArray(data.missions) ? data.missions : [];
      CONFIG.payments = Array.isArray(data.payments) ? data.payments : [];
    } else {
      CONFIG.missions = [];
      CONFIG.payments = [];
    }
    renderMissionsTable();
    renderPayments();
  } catch (e) {
    showToast('Gagal memuat data: ' + e.message, true);
  }
}

// === RENDER TABEL MISI ===
function renderMissionsTable() {
  const mWrap = $('missionListWrap'); 
  
  if (CONFIG.missions.length === 0) {
    mWrap.innerHTML = '<p style="color:#7d8ba3;">Belum ada misi di database. Silakan ke tab "+ Tambah Misi".</p>';
    return;
  }

  let html = '<table><thead><tr><th>Judul Misi</th><th>Poin</th><th>Link</th><th>Aksi</th></tr></thead><tbody>';
  CONFIG.missions.forEach((m, i) => {
    html += `
      <tr>
        <td><input type="text" value="${(m.title||'').replace(/"/g,'&quot;')}" onchange="updateMission(${i}, 'title', this.value)" style="padding:8px;border-radius:6px;border:1px solid #1f2a44;background:#0a0e1a;color:#fff;width:100%"/></td>
        <td><input type="number" value="${m.reward||0}" onchange="updateMission(${i}, 'reward', +this.value)" style="padding:8px;border-radius:6px;border:1px solid #1f2a44;background:#0a0e1a;color:#fff;width:70px"/></td>
        <td><input type="text" value="${(m.link||'').replace(/"/g,'&quot;')}" onchange="updateMission(${i}, 'link', this.value)" placeholder="https://..." style="padding:8px;border-radius:6px;border:1px solid #1f2a44;background:#0a0e1a;color:#fff;width:100%"/></td>
        <td><button class="btn-sm btn-danger" onclick="hapusMisi(${i})">Hapus</button></td>
      </tr>
    `;
  });
  html += '</tbody></table>';
  mWrap.innerHTML = html;
}

// === FUNGSI EDIT & HAPUS MISI ===
window.updateMission = (i, key, val) => { CONFIG.missions[i][key] = val; };
window.hapusMisi = (i) => { 
  if(confirm('Hapus misi ini?')) {
    CONFIG.missions.splice(i, 1); 
    renderMissionsTable(); 
  }
};

// === SIMPAN PERUBAHAN MISI ===
window.saveEditedMissions = async () => {
  const btn = $('btnSaveMissions');
  btn.disabled = true; btn.textContent = 'Menyimpan...';
  try {
    await setDoc(doc(db, "settings", "global"), { missions: CONFIG.missions }, { merge: true });
    showToast('Perubahan misi berhasil disimpan!', false);
  } catch (e) {
    showToast('Gagal menyimpan: ' + e.message, true);
  } finally {
    btn.disabled = false; btn.textContent = 'Simpan Perubahan';
  }
};

// === TAMBAH MISI BARU ===
window.submitNewMission = async () => {
  const title = $('newMissionTitle').value.trim();
  const reward = Number($('newMissionReward').value);
  const link = $('newMissionLink').value.trim();
  
  if (!title || !reward) return showToast('Judul dan Poin wajib diisi!', true);

  const newMission = { id: Date.now(), title, reward, link };
  CONFIG.missions.push(newMission);
  
  try {
    await setDoc(doc(db, "settings", "global"), { missions: CONFIG.missions }, { merge: true });
    showToast('Misi baru berhasil ditambahkan!', false);
    
    // Reset form
    $('newMissionTitle').value = '';
    $('newMissionReward').value = '10';
    $('newMissionLink').value = '';
    
    // Update tabel di tab sebelah
    renderMissionsTable();
    
    // Pindah ke tab daftar misi
    document.querySelector('.tab[data-tab="list-missions"]').click();
  } catch (e) {
    showToast('Gagal menambahkan misi: ' + e.message, true);
  }
};


// === RENDER & FUNGSI METODE WITHDRAW (Tetap sama) ===
function renderPayments() {
  const pWrap = $('paymentList'); pWrap.innerHTML = '';
  if (CONFIG.payments.length === 0) {
    pWrap.innerHTML = '<p style="color:#7d8ba3;margin-bottom:10px;">Belum ada metode pembayaran.</p>';
  } else {
    CONFIG.payments.forEach((p, i) => {
      const el = document.createElement('div'); 
      el.style = "display:flex;gap:10px;margin-bottom:10px;background:#0a0e1a;padding:12px;border-radius:8px;flex-wrap:wrap;align-items:center";
      el.innerHTML =
        '<input value="' + (p.name||'').replace(/"/g,'&quot;') + '" onchange="CONFIG.payments[' + i + '].name=this.value" placeholder="Nama (DANA/OVO)" style="flex:1;min-width:100px;padding:8px;border-radius:6px;border:1px solid #1f2a44;background:#0a0e1a;color:#fff"/>' +
        '<input value="' + (p.holder||'').replace(/"/g,'&quot;') + '" onchange="CONFIG.payments[' + i + '].holder=this.value" placeholder="Atas Nama" style="flex:1;min-width:100px;padding:8px;border-radius:6px;border:1px solid #1f2a44;background:#0a0e1a;color:#fff"/>' +
        '<label style="display:flex;align-items:center;gap:5px;color:#fff"><input type="checkbox" ' + (p.active?'checked':'') + ' onchange="CONFIG.payments[' + i + '].active=this.checked"/> Aktif</label>' +
        '<button class="btn-sm btn-danger" onclick="CONFIG.payments.splice(' + i + ',1);renderPayments()">Hapus</button>';
      pWrap.appendChild(el);
    });
  }
}

window.addPayment = () => { CONFIG.payments.push({ id: Date.now(), name: '', holder: '', active: true }); renderPayments(); };
window.savePayments = async () => {
  const btn = $('btnSavePayments');
  btn.disabled = true; btn.textContent = 'Menyimpan...';
  try {
    await setDoc(doc(db, "settings", "global"), { payments: CONFIG.payments }, { merge: true });
    showToast('Metode berhasil disimpan!', false);
  } catch (e) {
    showToast('Gagal menyimpan: ' + e.message, true);
  } finally {
    btn.disabled = false; btn.textContent = 'Simpan ke Firebase';
  }
};

// === KLAIM & WITHDRAW LISTENERS ===
function listenClaims() {
  onSnapshot(collection(db, "claims"), snap => {
    const wrap = $('claimsWrap');
    if (snap.empty) { wrap.innerHTML = '<p>Belum ada klaim.</p>'; return; }
    let html = '<table><tr><th>User</th><th>Misi</th><th>Poin</th><th>Bukti</th><th>Status & Alasan</th><th>Aksi</th></tr>';
    snap.forEach(d => {
      const c = d.data();
      html +=
        '<tr>' +
        '<td>' + (c.userEmail || c.userName || '-') + '</td>' +
        '<td>' + (c.missionTitle || '-') + '</td>' +
        '<td>' + (c.reward || 0) + '</td>' +
        '<td>' + (c.proofUrl ? '<a href="' + c.proofUrl + '" target="_blank"><img src="' + c.proofUrl + '" class="img-proof"/></a>' : '-') + '</td>' +
        '<td><span class="badge ' + c.status + '">' + c.status + '</span><br/><small style="color:#7d8ba3">' + (c.aiReason || '') + '</small></td>' +
        '<td>' +
          '<button class="btn-sm btn-ok" onclick="markClaim(\'' + d.id + '\',\'approved\')">Setujui</button>' +
          '<button class="btn-sm btn-danger" onclick="markClaim(\'' + d.id + '\',\'rejected\')">Tolak</button>' +
        '</td></tr>';
    });
    wrap.innerHTML = html + '</table>';
  });
}
window.markClaim = async (id, status) => {
  try {
    await updateDoc(doc(db, "claims", id), { status, processedAt: serverTimestamp() });
    showToast('Status klaim: ' + status, false);
  } catch (e) { showToast('Gagal update: ' + e.message, true); }
};

function listenWithdrawals() {
  onSnapshot(collection(db, "withdrawals"), snap => {
    const wrap = $('withdrawalsWrap');
    if (snap.empty) { wrap.innerHTML = '<p>Belum ada permintaan.</p>'; return; }
    let html = '<table><tr><th>User</th><th>Jumlah</th><th>Rekening</th><th>Status</th><th>Aksi</th></tr>';
    snap.forEach(d => {
      const w = d.data();
      html +=
        '<tr>' +
        '<td>' + (w.userEmail || '-') + '</td>' +
        '<td>' + fmt(w.amount) + '</td>' +
        '<td>' + (w.accountName||'') + ' - ' + (w.accountNumber||'') + '</td>' +
        '<td><span class="badge ' + w.status + '">' + w.status + '</span></td>' +
        '<td>' +
          '<button class="btn-sm btn-ok" onclick="markWd(\'' + d.id + '\',\'paid\')">Bayar</button>' +
          '<button class="btn-sm btn-danger" onclick="markWd(\'' + d.id + '\',\'rejected\')">Tolak</button>' +
        '</td></tr>';
    });
    wrap.innerHTML = html + '</table>';
  });
}
window.markWd = async (id, status) => {
  try {
    await updateDoc(doc(db, "withdrawals", id), { status, processedAt: serverTimestamp() });
    showToast('Status withdraw: ' + status, false);
  } catch (e) { showToast('Gagal update: ' + e.message, true); }
};
</script>
</body>
</html>
